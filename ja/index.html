const r=j=>Math.exp(C[j]*lv[j]);
const act=j=>j<10?true:j<13?(!n.T&&cls(n)>=10):j<20?n.T==2:n.T==3;
const gone=j=>j<10?(!!n.T||cls(n)>=(j?Math.min(j+2,10):2)):j<13?!!n.T:j<20?(n.T==3||(j>=17&&!(n.T==2&&n.c&&!n.c.T))||(n.T==2&&(j==13?n.t>=10:j==14?n.t>=1e6:j==15?n.t>=1e100:false))):(n.T==3&&(k>=E.length||(j==20?n.t>=1000:n.t>=1e6)));
const unl=j=>j==0||j==10||j==13||j==20||lv[j-1]>0||gone(j-1);
const why=j=>j<13?(n.T?'塔の段階を通過したため変更できません':'クラス10に達するまで変更できません'):j<20?((n.T|0)<2?'矢印の世界に入るまで変更できません':'矢印の段階を通過したため変更できません'):'グラハム列に入るまで変更できません';
function dsc(j){const x=r(j).toFixed(3);if(j>19)return['（グラハム列で作動）g の添字が毎秒 +'+(C[20]*lv[20]).toFixed(3),'（グラハム列で作動）g の添字が毎秒 ×'+x][j-20];if(j>16){const q=j-17;return'（矢印の本数が塔のとき作動）矢印の本数の塔の高さ'+(q==0?'が毎秒 ×'+x:q==1?'を毎秒 '+x+' 乗':'に log を'+q+'回取った数が毎秒 ×'+x)}if(j>12){const q=j-13;return'（矢印の世界で作動）'+(q==0?'矢印が毎秒 +'+(C[13]*lv[13]).toFixed(3)+' 本':q==1?'矢印の本数が毎秒 ×'+x:q==2?'矢印の本数を毎秒 '+x+' 乗':'矢印の本数に log を'+(q-1)+'回取った数が毎秒 ×'+x)}if(j>9){const q=j-10;return'（クラス10以上で作動）塔の高さ'+(q==0?'が毎秒 ×'+x:q==1?'を毎秒 '+x+' 乗':'に log を'+q+'回取った数が毎秒 ×'+x)}return j==0?'毎秒 +'+fp(Math.pow(2,lv[0]-1)):j==1?'毎秒 ×'+x:j==2?'毎秒 n を '+x+' 乗':'塔の指数に log を'+(j-1)+'回取った数が毎秒 ×'+x}
function tick(dt){
 if(clr)return;
 if(!n.T)n=add(n,{h:0,t:Math.pow(2,lv[0]-1)*dt});
 if(!n.T)for(let j=1;j<10;j++)if(lv[j])n=grow(n,j-1,.4343*C[j]*lv[j]*dt);
 if(!n.T)for(let j=10;j<13;j++)if(lv[j]&&cls(n)>=10)n=gh(n,j-10,.4343*C[j]*lv[j]*dt);
 for(let j=13;j<20;j++)if(lv[j]&&n.T==2)n=ga(n,j,dt);
 for(let j=20;j<22;j++)if(lv[j]&&n.T==3)n=gt(n,j,.4343*C[j]*lv[j]*dt);
 if(n.T==3&&n.t>=64)n={T:3,t:64};
 ins+=dt*(1+k*.5)/60;
 NT.forEach(x=>{if(!sn.includes(x.id)&&x.ok(n)){sn.push(x.id);Q.push({tag:'新しい表記法',t:x.name,v:'',b:x.text})}});
 while(k<E.length&&cmp(n,E[k].v)>=0){ins++;note('発見：'+E[k].n+'　ひらめき +1');if(E[k].d)Q.push({tag:'数の図鑑に追加',t:E[k].n,v:fm(E[k].v),b:E[k].d});k++;key=''}
 if(n.T==3&&n.t>=64&&!clr){clr=true;key='';Q.push({tag:'ゲームクリア',t:'グラハム数 g₆₄ に到達しました！',v:'g<sub>64</sub>',b:'おめでとうございます。矢印の本数を64段階で増やした、グラハム数にたどり着きました。数を数える旅はここで終わりです。'})}
}
let tm;function note(s){$('nt').textContent=s;clearTimeout(tm);tm=setTimeout(()=>$('nt').textContent='',5000)}
function draw(){
 $('num').innerHTML=fm(n);
 {const c=n.T?-1:cls(n),sh=c>=0&&c<1000;$('cls').hidden=!sh;if(sh)$('cls').textContent='クラス '+c+'（ムナフォの分類）'}
 const p=Math.floor(ins),fr=ins-p,sc=Math.ceil((1-fr)/((1+k*.5)/60));$('ins').textContent='ひらめき '+p;$('pgb').style.width=(fr*100).toFixed(1)+'%';$('pgt').textContent=clr?'ゲームクリア！ グラハム数に到達しました':'次のひらめきまで あと'+(sc>=60?Math.floor(sc/60)+'分'+sc%60+'秒':sc+'秒');
 const st=n.T?n.T:(cls(n)>=10?'h':'0'),kk=lv.join()+p+k+st+OP.map((_,j)=>+act(j)).join('')+(n.c?(n.c.T?2:1):0)+OP.map((_,j)=>+gone(j)).join('');
 if(kk!=key){key=kk;
  $('ops').innerHTML=OP.map((o,j)=>{if(gone(j)||!act(j)||(!unl(j)&&j&&!unl(j-1)))return'';const un=unl(j),ok=act(j),has=lv[j]||j==0;return'<div class="op'+(un?'':' off')+'"><div><b>'+o+'</b>　Lv '+lv[j]+'<div class="d">'+(un?(has?dsc(j):'未習得')+(ok?'':'<br><span class="why">'+why(j)+'</span>'):'直前の演算を習得すると開放')+'</div></div>'+(un?'<button class="btn" data-j="'+j+'"'+(clr||p<cost(j)||!ok?' disabled':'')+'>'+(lv[j]?'強化':'習得')+' '+cost(j)+'</button>':'')+'</div>'}).join('');
  $('nx').innerHTML=k<E.length?'？？？　<span style="font-family:STIX Two Text,serif">'+fm(E[k].v)+'</span> に到達すると発見':'図鑑をすべて集めました。';
  $('cx').innerHTML='<div class="u">'+E.slice(0,k).filter(e=>!e.d).map(e=>'<span>'+e.n+'</span>').join('')+'</div>'+E.slice(0,k).filter(e=>e.d).reverse().map(e=>'<div class="e"><b>'+e.n+'</b><span class="v">'+fm(e.v)+'</span><p>'+e.d+'</p></div>').join('')}
 {const nb=$('nb');if(k<E.length){const a=k?lp(E[k-1].v):0,b=lp(E[k].v),c=b>a?Math.min(1,Math.max(0,(lp(n)-a)/(b-a))):0;nb.style.width=(c*100).toFixed(1)+'%';$('np').textContent='次の発見まで '+Math.floor(c*100)+'%'}else{nb.style.width='100%';$('np').textContent='図鑑コンプリート'}}
 pump();
}
$('ops').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;const j=+b.dataset.j,c=cost(j);if(!clr&&act(j)&&unl(j)&&!gone(j)&&ins>=c){ins-=c;lv[j]++;key=''}draw()};
try{const s=JSON.parse(localStorage.getItem('kd1'));if(s&&s.n&&(s.n.t>=0||s.n.H)){n=s.n;if(s.ver<5&&n.T)n={T:n.T+1,t:n.t};if(n.T==1&&n.H)n={T:2,t:Math.min(4,3+(n.H.h-1)/7)};const o=s.lv||[];lv=lv.map((_,i)=>{const q=s.ver>=2?i:(i<15?i:(i>19?i-5:-1));return Math.max(+o[q]||0,i?0:1)});ins=+s.ins||0;k=Math.min(+s.k||0,E.length);if(s.ver<6){k=0;while(k<E.length&&cmp(n,E[k].v)>=0)k++}clr=!!s.clr;sn=Array.isArray(s.sn)?s.sn:NT.filter(x=>x.ok(n)).map(x=>x.id);}}catch(e){}
$('mo').onclick=()=>shut(false);$('ma').onclick=()=>shut(true);
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&mo)shut(false)});
const rv=(a,b)=>{$('rs').hidden=a;$('rc').hidden=b};
$('rs').onclick=()=>rv(true,false);$('rn').onclick=()=>rv(false,true);
$('ry').onclick=()=>{clr=false;n={h:0,t:1};lv=Array(22).fill(0);lv[0]=1;ins=2;k=0;key='';sn=[];Q=[];try{localStorage.removeItem('kd1')}catch(e){}rv(false,true);note('データを消去しました');draw()};
let last=performance.now();
setInterval(()=>{const t=performance.now();tick(Math.min((t-last)/1000,1));last=t;draw()},100);
setInterval(()=>{try{localStorage.setItem('kd1',JSON.stringify({n,lv,ins,k,ver:6,clr,sn,at:Date.now()}))}catch(e){}},5000);
draw();
</script>
