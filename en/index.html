<style>

.e{border-left:5px solid var(--ok);background:var(--card);border-radius:0 10px 10px 0;padding:8px 12px;margin-bottom:8px}
.e b{font-weight:900}
.e .v{font:400 16px "STIX Two Text",Georgia,serif;color:var(--mute);margin-left:8px}

.pgb{height:100%;width:0;background:var(--acc)}
.why{color:var(--mute);font-weight:700}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}

</head>
<body>
<main>
<div class="hd"><h1>Graham's Idle</h1><span class="mute" id="ins"></span></div>
<div class="pgw" aria-hidden="true"><div class="pgb" id="pgb"></div></div>
<div class="mute" id="pgt" style="margin-top:2px"></div>
<div id="nt" role="status"></div>
<div id="num" aria-live="off"></div>
<p id="cls"></p>
<h2>Grow the number</h2>
<div id="ops"></div>
<h2>Next discovery</h2>
<div id="nx"></div>
<div class="pgw" aria-hidden="true"><div class="pgb" style="background:var(--ok)" id="nb"></div></div>
<div class="mute" id="np" style="margin-top:2px"></div>
<h2>Number encyclopedia</h2>
<div id="cx"></div>
<div style="margin-top:28px"><button class="btn" id="rs" style="background:none;color:var(--mute);border:2px solid var(--line);padding:8px 14px;font-size:14px">Reset data</button>
<span id="rc" hidden><span class="mute">Really erase everything? </span><button class="btn" id="ry" style="padding:8px 14px;font-size:14px;background:#D93B2E;color:#fff">Erase</button> <button class="btn" id="rn" style="padding:8px 14px;font-size:14px;background:var(--line);color:var(--ink)">Cancel</button></span></div>
</main>
<div class="ov" id="md" hidden role="dialog" aria-modal="true" aria-labelledby="mt"><div class="mc"><div class="mute" id="mg"></div><h2 id="mt" style="margin:4px 0 6px"></h2><div id="mv" class="mval"></div><p id="mb" style="margin:8px 0 14px"></p><button class="btn" id="mo">Close</button> <button class="btn" id="ma" style="background:var(--line);color:var(--ink)" hidden>Close all</button></div></div>
<script>
const L=Math.log10,pw=x=>Math.pow(10,x);
const U=['','thousand','million','billion','trillion','quadrillion','quintillion','sextillion','septillion','octillion','nonillion','decillion','undecillion','duodecillion','tredecillion','quattuordecillion','quindecillion','sexdecillion','septendecillion','octodecillion','novemdecillion','vigintillion'];
/* number = a tower of h tens topped by t (h=0 means t itself) */
function nm(h,t){if(!(t<1e300))t=1e300;while(t>=1e15){t=L(t);h++}while(h>0&&t<15){t=pw(t);h--}return{h,t}}
const cmp=(a,b)=>{const x=a.T|0,y=b.T|0;if(x!=y)return x-y;if(x==1)return cmp(a.H,b.H);if(x==2){if(a.c&&b.c)return cmp(a.c,b.c);if(a.c)return 1;if(b.c)return -1}return x?a.t-b.t:(a.h-b.h||a.t-b.t)};
function add(a,b){if(cmp(a,b)<0)[a,b]=[b,a];if(a.T)return a;if(!a.h)return nm(0,a.t+b.t);if(a.h>1)return a;const s=b.h?b.t:(b.t>0?L(b.t):-99);return nm(1,a.t+L(1+pw(s-a.t)))}

function mul(b,lf){if(!b.h){const x=L(b.t)+lf;return x<14.9?nm(0,pw(x)):nm(1,x)}return b.h==1?nm(1,b.t+lf):b}
function grow(n,k,lf){let y=n;for(let i=0;i<k;i++){if(!y.h&&y.t<=1)return n;y=lg(y)}if(!y.h&&y.t<1)return n;y=mul(y,lf);for(let i=0;i<k;i++)y=ex(y);return y}

function gt(n,j,lf){const f=pw(Math.min(lf,300));let a=n.t;if(j==20)a+=Math.log(f);else a*=f;return{T:3,t:Math.min(a,1e300)}}

function gc(n,j,dt){const q=j-13,lf=.4343*C[j]*lv[j]*dt,c=n.c;let r;if(c.T==2){r=ga(c,j,dt);if(r.T==3||r.c||r.t>=4)return{T:3,t:2};return r===c?n:{T:2,t:1e300,c:r}}if(q==0)return n;r=q<4?grow(c,q-1,lf):gh(c,q-4,lf);return r===c?n:{T:2,t:1e300,c:r}}
const cls=b=>b.T?0:!b.h?(b.t<=6?0:b.t<=1e6?1:2):b.h==1?(b.t<=1e6?2:3):Math.floor(b.h+1+(L(b.t)>=10?1:0));
function fp(x){if(x>=1e15){const e=Math.floor(L(x));return(x/pw(e)).toFixed(2)+'×10<sup>'+e+'</sup>'}if(x<1e6)return Math.floor(x).toLocaleString('en-US');const i=Math.min(5,Math.floor(L(x)/3));return(x/pw(3*i)).toFixed(2)+' '+U[i]}
function tw(b){let t=L(b.t),h=b.h+1;if(t>=10){t=L(t);h++}return[h,t]}
function fm(b){if(b.T==2)return'3↑<sup>'+(b.c?fm(b.c):b.t<10?b.t.toFixed(2):fp(b.t))+'</sup>3';if(b.T==3)return'g<sub>'+(b.t<100?b.t.toFixed(2):fp(b.t))+'</sub>';if(!b.h)return fp(b.t);if(b.h==1){if(b.t<66){const i=Math.floor(b.t/3);return pw(b.t-3*i).toFixed(2)+' '+U[i]}const e=Math.floor(b.t);return pw(b.t-e).toFixed(2)+'×10<sup>'+fp(e)+'</sup>'}if(cls(b)<5)return b.h==2?'10<sup>'+fm({h:1,t:b.t})+'</sup>':'10<sup>10<sup>'+fm({h:1,t:b.t})+'</sup></sup>';const w=tw(b);return cls(b)>=10?'E#'+(w[0]<1e4?w[0].toFixed(2):fp(w[0])):'E'+w[1].toFixed(2)+'#'+fp(w[0])}
const E=[];
for(let i=2;i<=21;i++)E.push({n:U[i][0].toUpperCase()+U[i].slice(1),v:nm(1,3*i),d:i==21?'The last name in the standard short scale: 10⁶³. Beyond this, numbers are written with powers of ten.':''});
[['Eddington number',1,79.197,'An estimate of the number of protons in the observable universe: 136×2²⁵⁶ ≈ 1.57×10⁷⁹. Too big for a standard name.'],
['Googol',1,100,'10¹⁰⁰, named by nine-year-old Milton Sirotta. The origin of the name Google.'],
['Shannon number',1,120,'A conservative estimate of the number of possible chess games: 10¹²⁰.'],
['Centillion',1,303,'10³⁰³. One of the Latin-based naming systems for large numbers.'],
['A(4,2)',1,19728.3,'From the Ackermann function: 2⁶⁵⁵³⁶−3, about 20,000 digits. Still only class 2.'],
['3↑↑4',1,3.64e12,'3 to the 3 to the 3 to the 3. Tetration with two arrows. The exponent alone is about 3.6 trillion.'],
['Unspeakable-unspeakable turn',1,3.72e37,'A number from the Avatamsaka Sutra, 10^(7×2¹²²). Class 3 starts here.'],
['Googolplex',1,1e100,'10 to the googol. Even using every particle in the universe as ink, you could not write it out in decimal.'],
['A(4,3)',2,19727.78,'≈10^(6×10¹⁹⁷²⁷). One step up in the Ackermann function overtakes the googolplex.'],
['Promaxima',2,245,'Cybian\'s estimate of the number of possible histories of the universe ≈10^10^245.'],
['First Skewes number',3,34,'An upper bound for where the prime-counting function first falls behind the logarithmic integral (1933). Class 4.'],
['Googolduplex',3,100,'10 to the googolplex. A 3-level tower of 10s with 100 on top.'],
['Second Skewes number',3,963.5,'The top of the tower is about 963. Munafo\'s Hypercalc can compute it directly.'],
['Largest number used in cosmology',3,3.98e12,'Don Page\'s estimate. What looks like a 5-level tower is effectively 4 once the top, 10^1.1, is computed.'],
['Googoltriplex',4,100,'A 4-level tower of 10s with 100 on top. The world of class 5 and beyond.'],
['10↑↑5',4,10,'A tower of five 10s. Up to here we are just stacking exponents.'],['10↑↑6',5,10,'Each extra level makes the previous number negligible.'],['10↑↑7',6,10,'A tower of seven 10s.'],['10↑↑8',7,10,'A tower of eight 10s.'],['10↑↑9',8,10,'A tower of nine 10s.'],['10↑↑10',9,10,'A tower of ten 10s. From here on, you grow the tower\'s height itself.'],
['10↑↑15',14,10,'A tower of fifteen 10s.'],['10↑↑20',19,10,'A tower of twenty 10s.'],['10↑↑100',99,10,'A 100-level tower. You can get this far just by stacking exponents.'],
['10↑↑10⁶',1e6,10,'A tower one million levels tall.'],
['10↑↑10¹⁰',1e10,10,'A tower ten billion levels tall. Almost at 3↑↑↑3.']].forEach(x=>E.push({n:x[0],v:nm(x[1],x[2]),d:x[3]}));
[['3↑↑↑3',2,3,'3↑↑(3↑↑3): a tower of about 7.6 trillion 3s. From here on, numbers are counted by the number of arrows.'],
['g₁ = 3↑↑↑↑3',2,4,'The first step toward Graham\'s number. Only four arrows, but already beyond any tower.'],
['3↑¹⁰ 3',2,10,'Ten arrows. Every extra arrow makes the previous number negligible.'],
['3↑¹⁰⁰ 3',2,100,'One hundred arrows.'],
['3↑^googol 3',2,1e100,'A googol arrows. Still nowhere near g₂.'],
['g₂ = 3↑^(g₁) 3',3,2,'The number of arrows becomes g₁, the number you just passed. The second step toward Graham\'s number.'],
['g₄',3,4,'The number of arrows is g₃.'],['g₁₆',3,16,'48 more steps to Graham\'s number.'],['g₃₂',3,32,'Halfway there.'],
['Graham\'s number g₆₄',3,64,'Made by growing the number of arrows through 64 steps. Introduced by Martin Gardner in 1977, and listed in the 1980 Guinness Book of Records as the largest number used in a mathematical proof.'],
['g₁₀₀',3,100,'You have passed Graham\'s number. Conway chained arrow notation 3→3→3→3 lies even further ahead.']].forEach(x=>E.push({n:x[0],v:{T:x[1],t:x[2]},d:x[3]}));
[['3↑^(10↑↑10) 3',nm(9,10),'The number of arrows is now a tower of ten 10s. From here on, you grow the arrow count itself as a tower.'],
['3↑^(10↑↑10¹⁰) 3',nm(1e10,10),'The number of arrows is a tower ten billion levels tall.'],
['3↑^(3↑↑↑3) 3',{T:2,t:3},'The number of arrows is now 3↑↑↑3. The arrow count itself is written in arrow notation. The moment it reaches g₁ = 3↑↑↑↑3, you arrive at g₂.']].forEach(x=>E.push({n:x[0],v:{T:2,t:1e300,c:x[1]},d:x[2]}));
E.sort((a,b)=>cmp(a.v,b.v));
const NT=[
{id:'jp',name:'Number names (million, billion, trillion…)',ok:b=>!b.T&&(b.h>0||b.t>=1e6),text:'Numbers are grouped by thousands and named: million, billion, trillion, quadrillion… Up to the vigintillion (10 to the 63rd), these are the standard names in the short scale.'},
{id:'sci',name:'Powers of ten (scientific notation)',ok:b=>!b.T&&(b.h>1||(b.h==1&&b.t>=66)),text:'You have passed the vigintillion, so numbers are now written as a power of ten, like 1.23×10^80. The small raised number (the exponent) tells you how many digits there are.'},
{id:'tower',name:'Tower notation E…#…',ok:b=>!b.T&&cls(b)>=5,text:'You reached class 5. The tower of powers of ten has become too tall, so numbers are written like E1.70#5. The number after E is the top (1 or more, less than 10); the number after # is how many 10s are stacked. E1.70#5 means 10^10^10^10^10^1.70.'},
{id:'tower2',name:'Tower notation E#… (top omitted)',ok:b=>!b.T&&cls(b)>=10,text:'You reached class 10. With a tower this tall, the top number (1 to 10) hardly matters. So it is dropped, and only the height is shown with decimals, like E#12.34: a tower of 12.34 tens (the decimal is a partial level). From here on, only the height grows.'},
{id:'arrow',name:'Arrow notation 3↑ⁿ3',ok:b=>b.T>=2,text:'The tower height has reached 3↑↑3 = 7,625,597,484,987 levels (about 7.6 trillion). From this number, 3↑↑↑3 = 3↑↑(3↑↑3), we use Knuth\'s up-arrow notation and count by the number of arrows. Each extra arrow makes the number unimaginably larger. In 3↑ⁿ3 on screen, n is the number of arrows; a decimal means a partial arrow.'},
{id:'g',name:'Graham sequence gₘ',ok:b=>b.T>=3,text:'Even the number of arrows can no longer be counted. Let g₁ = 3↑↑↑↑3; then g₂ is 3↑…↑3 with g₁ arrows, g₃ has g₂ arrows, and so on, each number becoming the next arrow count. g₆₄ is Graham\'s number. The m in gₘ on screen is how far along the sequence you are.'}];
function lp(b){if(b.T==2&&b.c)return 700+(b.c.T?14+Math.min(1,b.c.t-3)*5:lp(b.c))/100;if(b.T==2)return 400+L(Math.max(b.t,1));if(b.T==3)return 700+L(Math.max(b.t,1));const g=b.h?(L(b.t)-1.1761)/13.8239:L(Math.max(b.t,1))/15;return L(1+b.h+g)}
let mo=false;
function pump(){if(mo||!Q.length)return;const q=Q[0];mo=true;$('mg').textContent=q.tag+(Q.length>1?' ('+(Q.length-1)+' more)':'');$('mt').textContent=q.t;$('mv').innerHTML=q.v;$('mb').textContent=q.b;$('ma').hidden=Q.length<2;$('mo').textContent=Q.length>1?'Next':'Close';$('md').hidden=false;$('mo').focus()}
function shut(all){Q=all?[]:Q.slice(1);mo=false;$('md').hidden=true;pump()}
const OP=['Addition','Multiplication','Exponentiation','Exponent of exponent','Triple exponent','4-fold exponent','5-fold exponent','6-fold exponent','7-fold exponent','8-fold exponent','Stretch the tower','Raise the tower','Height of the height','Tetration','Pentation','Hexation','Heptation','Octation','Hyper-9','Hyper-10','Advance the Graham sequence','Accelerate the Graham sequence'];
let clr=false,n={h:0,t:1},lv=Array(22).fill(0),ins=2,k=0,key='',sn=[],Q=[];lv[0]=1;
const $=id=>document.getElementById(id);
const cost=j=>Math.ceil((j+1)*Math.pow(1.5,lv[j]));
const C=[0,.06,.0015,.0015,.0022,.003,.0037,.0045,.005,.0055,.0015,.0005,.0004,.0003,.0004,.001,.0007,.0007,.0007,.0007,.0014,.0008];
const r=j=>Math.exp(C[j]*lv[j]);
const act=j=>j<10?true:j<13?(!n.T&&cls(n)>=10):j<20?n.T==2:n.T==3;
const gone=j=>j<10?(!!n.T||cls(n)>=(j?Math.min(j+2,10):2)):j<13?!!n.T:j<20?(n.T==3||(j>=17&&!(n.T==2&&n.c&&!n.c.T))||(n.T==2&&(j==13?n.t>=10:j==14?n.t>=1e6:j==15?n.t>=1e100:false))):(n.T==3&&(k>=E.length||(j==20?n.t>=1000:n.t>=1e6)));

const why=j=>j<13?(n.T?'Locked: you have passed the tower stage':'Locked until you reach class 10'):j<20?((n.T|0)<2?'Locked until you enter the arrow world':'Locked: you have passed the arrow stage'):'Locked until you enter the Graham sequence';
function dsc(j){const x=r(j).toFixed(3);if(j>19)return['(works in the Graham sequence) g index +'+(C[20]*lv[20]).toFixed(3)+' per second','(works in the Graham sequence) g index ×'+x+' per second'][j-20];if(j>16){const q=j-17;return'(works while the arrow count is a tower) arrow-count tower height '+(q==0?'×'+x+' per second':q==1?'to the power '+x+' per second':'log taken '+q+' time(s), then ×'+x+' per second')}if(j>12){const q=j-13;return'(works in the arrow world) '+(q==0?'+'+(C[13]*lv[13]).toFixed(3)+' arrows per second':q==1?'arrow count ×'+x+' per second':q==2?'arrow count to the power '+x+' per second':'log of the arrow count taken '+(q-1)+' time(s), then ×'+x+' per second')}if(j>9){const q=j-10;return'(works at class 10+) tower height '+(q==0?'×'+x+' per second':q==1?'to the power '+x+' per second':'log taken '+q+' time(s), then ×'+x+' per second')}return j==0?'+'+fp(Math.pow(2,lv[0]-1))+' per second':j==1?'×'+x+' per second':j==2?'n to the power '+x+' per second':'log of the tower\'s exponent taken '+(j-1)+' time(s), then ×'+x+' per second'}
function tick(dt){
 if(clr)return;

 ins+=dt*(1+k*.5)/60;
 NT.forEach(x=>{if(!sn.includes(x.id)&&x.ok(n)){sn.push(x.id);Q.push({tag:'New notation',t:x.name,v:'',b:x.text})}});
 while(k<E.length&&cmp(n,E[k].v)>=0){ins++;note('Discovered: '+E[k].n+'  Insight +1');if(E[k].d)Q.push({tag:'Added to the encyclopedia',t:E[k].n,v:fm(E[k].v),b:E[k].d});k++;key=''}
 if(n.T==3&&n.t>=64&&!clr){clr=true;key='';Q.push({tag:'Game clear',t:'You reached Graham\'s number, g₆₄!',v:'g<sub>64</sub>',b:'Congratulations. You have reached Graham\'s number, made by growing the number of arrows through 64 steps. Your journey of counting ends here.'})}
}
let tm;function note(s){$('nt').textContent=s;clearTimeout(tm);tm=setTimeout(()=>$('nt').textContent='',5000)}
function draw(){
 $('num').innerHTML=fm(n);
 {const c=n.T?-1:cls(n),sh=c>=0&&c<1000;$('cls').hidden=!sh;if(sh)$('cls').textContent='Class '+c+' (Munafo\'s classification)'}
 const p=Math.floor(ins),fr=ins-p,sc=Math.ceil((1-fr)/((1+k*.5)/60));$('ins').textContent='Insight '+p;$('pgb').style.width=(fr*100).toFixed(1)+'%';$('pgt').textContent=clr?'Game clear! You reached Graham\'s number':'Next insight in '+(sc>=60?Math.floor(sc/60)+'m '+sc%60+'s':sc+'s');
 const st=n.T?n.T:(cls(n)>=10?'h':'0'),kk=lv.join()+p+k+st+OP.map((_,j)=>+act(j)).join('')+(n.c?(n.c.T?2:1):0)+OP.map((_,j)=>+gone(j)).join('');
 if(kk!=key){key=kk;
  $('ops').innerHTML=OP.map((o,j)=>{if(gone(j)||!act(j)||(!unl(j)&&j&&!unl(j-1)))return'';const un=unl(j),ok=act(j),has=lv[j]||j==0;return'<div class="op'+(un?'':' off')+'"><div><b>'+o+'</b>  Lv '+lv[j]+'<div class="d">'+(un?(has?dsc(j):'Not learned')+(ok?'':'<br><span class="why">'+why(j)+'</span>'):'Unlocks after learning the previous operation')+'</div></div>'+(un?'<button class="btn" data-j="'+j+'"'+(clr||p<cost(j)||!ok?' disabled':'')+'>'+(lv[j]?'Upgrade':'Learn')+' '+cost(j)+'</button>':'')+'</div>'}).join('');
  $('nx').innerHTML=k<E.length?'???  Reach <span style="font-family:STIX Two Text,serif">'+fm(E[k].v)+'</span> to discover':'You have collected the whole encyclopedia.';
  $('cx').innerHTML='<div class="u">'+E.slice(0,k).filter(e=>!e.d).map(e=>'<span>'+e.n+'</span>').join('')+'</div>'+E.slice(0,k).filter(e=>e.d).reverse().map(e=>'<div class="e"><b>'+e.n+'</b><span class="v">'+fm(e.v)+'</span><p>'+e.d+'</p></div>').join('')}
 {const nb=$('nb');if(k<E.length){const a=k?lp(E[k-1].v):0,b=lp(E[k].v),c=b>a?Math.min(1,Math.max(0,(lp(n)-a)/(b-a))):0;nb.style.width=(c*100).toFixed(1)+'%';$('np').textContent='Next discovery: '+Math.floor(c*100)+'%'}else{nb.style.width='100%';$('np').textContent='Encyclopedia complete'}}
 pump();
}
$('ops').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;const j=+b.dataset.j,c=cost(j);if(!clr&&act(j)&&unl(j)&&!gone(j)&&ins>=c){ins-=c;lv[j]++;key=''}draw()};
try{const s=JSON.parse(localStorage.getItem('kd1en'));if(s&&s.n&&(s.n.t>=0||s.n.H)){n=s.n;if(s.ver<5&&n.T)n={T:n.T+1,t:n.t};if(n.T==1&&n.H)n={T:2,t:Math.min(4,3+(n.H.h-1)/7)};const o=s.lv||[];lv=lv.map((_,i)=>{const q=s.ver>=2?i:(i<15?i:(i>19?i-5:-1));return Math.max(+o[q]||0,i?0:1)});ins=+s.ins||0;k=Math.min(+s.k||0,E.length);if(s.ver<6){k=0;while(k<E.length&&cmp(n,E[k].v)>=0)k++}clr=!!s.clr;sn=Array.isArray(s.sn)?s.sn:NT.filter(x=>x.ok(n)).map(x=>x.id);}}catch(e){}
$('mo').onclick=()=>shut(false);$('ma').onclick=()=>shut(true);
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&mo)shut(false)});
const rv=(a,b)=>{$('rs').hidden=a;$('rc').hidden=b};
$('rs').onclick=()=>rv(true,false);$('rn').onclick=()=>rv(false,true);
$('ry').onclick=()=>{clr=false;n={h:0,t:1};lv=Array(22).fill(0);lv[0]=1;ins=2;k=0;key='';sn=[];Q=[];try{localStorage.removeItem('kd1en')}catch(e){}rv(false,true);note('Data erased');draw()};
let last=performance.now();
setInterval(()=>{const t=performance.now();tick(Math.min((t-last)/1000,1));last=t;draw()},100);
setInterval(()=>{try{localStorage.setItem('kd1en',JSON.stringify({n,lv,ins,k,ver:6,clr,sn,at:Date.now()}))}catch(e){}},5000);
draw();
</script>
